<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ניהול – חמין עד הבית</title>
  <link rel="icon" href="logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<section class="login" id="login">
  <form class="login-card" id="loginForm">
    <img src="logo.jpg" alt="" width="72" height="72">
    <h1>ניהול החנות</h1>
    <p class="muted">חמין עד הבית &middot; הסירים של מרי אס</p>
    <label class="field">
      <span>סיסמה</span>
      <input type="password" id="pass" autocomplete="current-password" required>
    </label>
    <p class="form-error" id="loginErr" hidden>הסיסמה שגויה.</p>
    <button type="submit" class="primary">כניסה</button>
    <p class="demo-hint">סקיצת הדגמה. סיסמת הדמו: <strong dir="ltr">1234</strong><br>באתר האמיתי הכניסה תהיה עם סיסמה אישית שמאומתת בשרת.</p>
    <a class="back-link" href="index.html">חזרה לאתר ההזמנות</a>
  </form>
</section>

<div id="app" hidden>
  <header class="a-header">
    <div class="a-brand">
      <img src="logo.jpg" alt="" width="40" height="40">
      <div><strong>ניהול</strong><span>חמין עד הבית</span></div>
    </div>
    <div class="a-actions">
      <a class="a-link" href="index.html" target="_blank" rel="noopener">צפייה באתר</a>
      <button type="button" class="a-link" id="logout">יציאה</button>
    </div>
  </header>

  <nav class="a-tabs" id="tabs" aria-label="אזורי הניהול"></nav>
  <main class="a-main" id="panel"></main>
</div>

<div class="toast" id="toast" role="status" hidden>נשמר</div>

<script src="shared.js"></script>
<script src="admin.js"></script>
</body>
</html>
